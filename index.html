<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🌦 Advanced Weather App</h1>
      <button id="darkModeToggle" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <section class="search-section">
      <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" />
      <button id="searchBtn">Get Weather</button>
      <button id="locationBtn" title="Get weather for your location">📍 Use My Location</button>
    </section>

    <section id="currentWeather" class="weather-section hidden">
      <h2>Current Weather</h2>
      <div class="weather-info">
        <div class="weather-icon" id="currentIcon"></div>
        <div class="weather-details" id="currentDetails"></div>
      </div>
    </section>

    <section id="forecast" class="weather-section hidden">
      <h2>5-Day Forecast</h2>
      <div id="forecastCards" class="forecast-cards"></div>
    </section>

    <footer>
      <p>Data from <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
